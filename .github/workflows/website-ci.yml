name: Deploy Website
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
 
permissions:
  id-token: write
      
jobs:
  
  build:      
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::636710162452:role/Github_action_workflow
          role-session-name: MySessionName

      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            set -e
            DEPLOY_DIR="$HOME/github-actions-practice"
            if [ -d "$DEPLOY_DIR/.git" ]; then
              git -C "$DEPLOY_DIR" pull --ff-only origin main
            else
              git clone --branch main https://github.com/PrachiPatil2100/github-actions-practice.git "$DEPLOY_DIR"
            fi
            sudo -n install -m 0644 "$DEPLOY_DIR/index.html" /var/www/html/index.html